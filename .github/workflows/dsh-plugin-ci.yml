name: DSH Plugin CI

# Continuous checks for the DSH bundle in dsh-plugin/. The release workflow
# (.github/workflows/dsh-plugin-release.yml) only runs on tags; this one runs on
# every change so a regression is caught before a release is attempted.
on:
  push:
    branches: [main]
    paths:
      - 'dsh-plugin/**'
      - '.github/workflows/dsh-plugin-ci.yml'
  pull_request:
    paths:
      - 'dsh-plugin/**'

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: tests + coverage (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve the bundled CLI version
        id: cli_version
        run: |
          set -euo pipefail
          version=$(grep -oP '^\s*version\s*=\s*"\K[0-9][^"]*' cmd/aiprison/main.go | head -n1)
          if [ -z "${version}" ]; then
            echo "cannot read the CLI version from cmd/aiprison/main.go" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the six bundled CLIs
        env:
          AIPRISON_VERSION: ${{ steps.cli_version.outputs.version }}
        run: node dsh-plugin/scripts/build-binaries.mjs

      - name: Tests with coverage gate
        working-directory: dsh-plugin
        run: npm run coverage

      - name: Release gate
        working-directory: dsh-plugin
        run: node scripts/release-check.mjs

  test-windows:
    name: tests (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve the bundled CLI version
        id: cli_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oP '^\s*version\s*=\s*"\K[0-9][^"]*' cmd/aiprison/main.go | head -n1)
          if [ -z "${version}" ]; then
            echo "cannot read the CLI version from cmd/aiprison/main.go" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the six bundled CLIs
        env:
          AIPRISON_VERSION: ${{ steps.cli_version.outputs.version }}
        run: node dsh-plugin/scripts/build-binaries.mjs

      - name: Unit and integration tests
        working-directory: dsh-plugin
        run: node --test (Get-ChildItem test -Filter *.test.mjs).FullName
