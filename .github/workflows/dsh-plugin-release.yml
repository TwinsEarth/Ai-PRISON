name: DSH Plugin Release

# Release the DSH bundle shipped in dsh-plugin/. A tag push builds the six
# platform CLIs, runs the tests and the release gate, packs the npm tarball and
# publishes the GitHub Release assets. npm publishing stays a maintainer step
# because the account requires interactive 2FA approval.
on:
  push:
    tags: ['dsh-plugin-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. dsh-plugin-v1.1.0'
        required: true
        type: string

permissions: {}

jobs:
  package:
    name: build and verify the DSH plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve the bundled CLI version
        id: cli_version
        run: |
          set -euo pipefail
          version=$(grep -oP '^\s*version\s*=\s*"\K[0-9][^"]*' cmd/aiprison/main.go | head -n1)
          if [ -z "${version}" ]; then
            echo "cannot read the CLI version from cmd/aiprison/main.go" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundled CLI version: ${version}"

      - name: Build the six bundled CLIs
        env:
          # Pass the version explicitly: the 1.7.7 run silently stamped 1.0.0.
          AIPRISON_VERSION: ${{ steps.cli_version.outputs.version }}
        run: node dsh-plugin/scripts/build-binaries.mjs

      # SignPath (free for OSS) Authenticode-signs the Windows binaries. The
      # steps are skipped unless the repository defines the SignPath variables
      # and secret, so a fork without credentials still builds (unsigned).
      - name: Upload unsigned Windows CLIs
        id: unsigned_windows
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-clis
          path: dsh-plugin/bin/windows-*
          retention-days: 1

      - name: Sign Windows CLIs with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows

      - name: Install signed Windows CLIs
        if: ${{ steps.signpath.outcome == 'success' }}
        run: |
          set -euo pipefail
          find signed-windows -name 'aiprison.exe' -print
          for arch in amd64 arm64; do
            src="signed-windows/windows-${arch}/aiprison.exe"
            test -s "${src}"
            cp "${src}" "dsh-plugin/bin/windows-${arch}/aiprison.exe"
            ls -l "dsh-plugin/bin/windows-${arch}/aiprison.exe"
          done

      - name: Note unsigned fallback
        if: ${{ steps.signpath.outcome != 'success' }}
        run: echo "::warning::SignPath credentials are not configured; Windows CLIs stay unsigned. See dsh-plugin/docs/SUPPLY-CHAIN.md."

      - name: Unit and integration tests (ubuntu)
        working-directory: dsh-plugin
        run: node --test test/*.test.mjs

      - name: Coverage gate (lines 70 / branches 65 / functions 75)
        working-directory: dsh-plugin
        run: npm run coverage

      - name: Release gate
        working-directory: dsh-plugin
        run: node scripts/release-check.mjs

      - name: Pack the npm tarball
        id: pack
        working-directory: dsh-plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist
          npm pack --pack-destination ../dist
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build per-platform lite tarballs
        working-directory: dsh-plugin
        run: node scripts/pack-platform.mjs --all --out ../dist/platform-packs

      - name: Checksum the release assets
        working-directory: dsh-plugin
        run: |
          set -euo pipefail
          cd ../dist
          sha256sum ./*.tgz platform-packs/*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tgz
            dist/platform-packs/*.tgz
            dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-assets
          path: |
            dist/*.tgz
            dist/platform-packs/*.tgz
            dist/SHA256SUMS
            dsh-plugin/icon.svg
            dsh-plugin/docs/preview.svg
          retention-days: 7

  test-windows:
    name: unit and integration tests (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the six bundled CLIs
        run: node dsh-plugin/scripts/build-binaries.mjs

      - name: Unit and integration tests (windows)
        working-directory: dsh-plugin
        run: node --test test/*.test.mjs

  release:
    name: publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: dsh-plugin-assets
          path: assets

      - name: Collect assets into one directory
        run: |
          set -euo pipefail
          mkdir -p dist
          find assets -type f \( -name '*.tgz' -o -name 'SHA256SUMS' -o -name '*.svg' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Extract release notes from the plugin CHANGELOG
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          version="${TAG#dsh-plugin-v}"
          awk -v t="${version}" '
            $0 ~ "^## \\["t"\\]" { on=1; next }
            on && $0 ~ /^## \[/ { exit }
            on { print }
          ' dsh-plugin/CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            printf "DSH plugin release %s\n\nSee dsh-plugin/CHANGELOG.md for details.\n" "${TAG}" > RELEASE_BODY.md
          fi
          cat RELEASE_BODY.md

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/icon.svg
            dist/preview.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
